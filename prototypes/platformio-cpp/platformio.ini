[platformio]
default_envs = xiao_esp32s3

; Firmware for the Seeed XIAO ESP32-S3 + Wio-SX1262 watch.
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
build_flags =
  -D MOS_VERSION=\"0.1.0\"
  ; Display: SSD1306-class 128x64 I2C OLED on D4/D5. UNVERIFIED for the real panel.
  -D MOS_DISPLAY_SSD1306=1
  -D MOS_DISPLAY_W=128
  -D MOS_DISPLAY_H=64
  -D MOS_I2C_SDA=5
  -D MOS_I2C_SCL=6
  -D MOS_DISPLAY_ADDR=0x3C
  ; Touch: CST816S-style controller on the same I2C bus. UNVERIFIED. Set to 0 to
  ; use only the serial `tap`/`swipe` commands.
  -D MOS_TOUCH_CST816S=1
  -D MOS_TOUCH_INT=2
  -D MOS_TOUCH_RST=3
  ; Mission Link radio: same Wio-SX1262 B2B mapping and RX-only settings as
  ; Mission-Link/platformio.ini. TX stays blocked (ML_RF_ENABLED=0).
  -D ML_RADIO_PINMAP_VERIFIED=1
  -D ML_RADIO_RX_ENABLED=1
  -D ML_RADIO_SCK=7
  -D ML_RADIO_MISO=8
  -D ML_RADIO_MOSI=9
  -D ML_RADIO_CS=41
  -D ML_RADIO_DIO1=39
  -D ML_RADIO_RESET=42
  -D ML_RADIO_BUSY=40
  -D ML_RADIO_ANT_SW=38
  -D ML_RADIO_FREQ_MHZ=915.0
  -D ML_RADIO_BANDWIDTH_KHZ=125.0
  -D ML_RADIO_SPREADING_FACTOR=9
  -D ML_RADIO_CODING_RATE=7
  -D ML_RADIO_SYNC_WORD=0x12
  -D ML_RADIO_TX_POWER_DBM=10

; Host-side logic tests: protocol, messaging, gestures, UI, console.
[env:native]
platform = native
build_flags = -std=c++17 -I test/support
test_build_src = no
lib_deps =
  mos_core
  mos_app_missionlink
  mos_app_system
  mos_app_stopwatch
  mos_app_settings
  missionlink
