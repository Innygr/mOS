name: Mission Link codec tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable codec tests
        run: sh tests/run_host_tests.sh
      - name: Re-run host tests under AddressSanitizer and UBSan
        run: ML_EXTRA_CFLAGS="-g -fsanitize=address,undefined -fno-sanitize-recover=all" sh tests/run_host_tests.sh

  firmware-build:
    # Catches broken ESP-IDF component registration / CMake wiring that the
    # host tests cannot see. Builds only; nothing is flashed.
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware for ESP32-S3
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
